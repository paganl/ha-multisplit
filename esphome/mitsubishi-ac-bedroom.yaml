substitutions:
  device_name: mitsubishi-ac-bedroom
  friendly_name: "mitsubishi-ac-bedroom"
  restart_button_name: "Bedroom A/C Restart"
  room_label: Bedroom

  remote_temp_sensor: sensor.bedroom_current_temperature

  # HA binary sensor group: on/open = a window or door in this room is open.
  # CHECK: named to match the other rooms; correct it if your group differs.
  ac_lockout_sensor: binary_sensor.ac_lockout_bedroom
  ac_lockout_delay: 2min

  hp_rx_pin: GPIO26
  hp_tx_pin: GPIO25

packages:
  # Local: holds your Wi-Fi secrets.
  wifi: !include common/wifi.yaml
  # Shared config, maintained in GitHub. Fetched fresh on every build:
  # Clean Build Files does not clear the package cache, so a longer
  # refresh would keep building from an old copy.
  shared:
    url: https://github.com/paganl/ha-multisplit
    ref: main
    refresh: always
    files:
      - esphome/common/base.yaml
      - esphome/common/cn105.yaml
      - esphome/common/window_lockout.yaml
      - esphome/common/diagnostics.yaml

api:
  encryption:
    key: !secret mitsubishi_ac_bedroom_api_key

wifi:
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret mitsubishi_ac_bedroom_ap_password

climate:
  - id: !extend hp
    supports:
      swing_mode:
        - 'OFF'
        - VERTICAL

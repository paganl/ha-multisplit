# Shared by every Mitsubishi indoor-unit controller.
#
# Required substitutions (set in the room file):
#   device_name, friendly_name

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    # A room file can override this (erin runs esp-idf).
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"

logger:
  level: INFO

ota:
  - platform: esphome

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

# Shared by every Mitsubishi indoor-unit controller.
#
# Required substitutions (set in the room file):
#   device_name, friendly_name

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    # A room file can override this (erin runs esp-idf).
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"

logger:
  level: INFO

ota:
  - platform: esphome

captive_portal:

# Default scan parameters on purpose. The old interval = window = 1100ms
# had the radio listening for Bluetooth 100% of the time, which ESPHome
# warns can make Wi-Fi unstable on a Wi-Fi proxy.
esp32_ble_tracker:

bluetooth_proxy:
  active: true

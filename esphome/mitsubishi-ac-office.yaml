substitutions:
  device_name: mitsubishi-ac-office
  friendly_name: mitsubishi-ac-office
  restart_button_name: "Office AC Restart"

  remote_temp_sensor: sensor.office_current_temp

  hp_rx_pin: GPIO26
  hp_tx_pin: GPIO25

packages:
  # Local: holds your Wi-Fi secrets.
  wifi: !include common/wifi.yaml
  # Shared config, maintained in GitHub. Fetched fresh on every build:
  # Clean Build Files does not clear the package cache, so a longer
  # refresh would keep building from an old copy.
  shared:
    url: https://github.com/paganl/ha-multisplit
    ref: main
    refresh: always
    files:
      - esphome/common/base.yaml
      - esphome/common/cn105.yaml
      - esphome/common/diagnostics.yaml
  # No window lockout sensor for this room yet. To add one, list
  # esphome/common/window_lockout.yaml above and set ac_lockout_sensor,
  # ac_lockout_delay and room_label in substitutions.

api:
  encryption:
    key: !secret mitsubishi_ac_office_api_key

wifi:
  ap:
    ssid: "${friendly_name}"
    password: !secret mitsubishi_ac_office_ap_password

climate:
  - id: !extend hp
    vertical_vane_select:
      name: "${friendly_name} Vertical Vane"
      disabled_by_default: false
    horizontal_vane_select:
      name: "${friendly_name} Horizontal Vane"
      disabled_by_default: false
    outside_air_temperature_sensor:
      name: "Mitsubishi Outside Air Temperature"
      disabled_by_default: true

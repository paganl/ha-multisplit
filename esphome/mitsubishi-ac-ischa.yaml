substitutions:
  device_name: mitsubishi-ac-ischa
  friendly_name: "mitsubishi-ac-ischa"
  room_label: Ischa's bedroom
  restart_button_name: "Ischa AC Restart"

  # CHECK: spelled "escha". If this entity doesn't exist in HA, the unit
  # gets no room temperature at all now that the duplicate feed from
  # climate.ischa_bedroom is gone.
  remote_temp_sensor: sensor.escha_current_temp

  # HA binary sensor group: on/open = a window or door in this room is open.
  ac_lockout_sensor: binary_sensor.ac_lockout_ischa_bedroom
  ac_lockout_delay: 2min

  hp_rx_pin: GPIO26
  hp_tx_pin: GPIO25

packages:
  # Local: holds your Wi-Fi secrets.
  wifi: !include common/wifi.yaml
  # Shared config, maintained in GitHub. After changing it there, use
  # Clean Build Files on this device before installing, or the cached
  # copy (refreshed daily) is used.
  shared:
    url: https://github.com/paganl/ha-multisplit
    ref: main
    refresh: 1d
    files:
      - esphome/common/base.yaml
      - esphome/common/cn105.yaml
      - esphome/common/window_lockout.yaml
      - esphome/common/diagnostics.yaml

logger:
  level: INFO
  logs:
    # CN105 connection/bootstrap diagnostics (UART init + CONNECT handshake)
    CN105_CONN: INFO
    CN105Climate: WARN
    climate: WARN
    sensor: WARN
    WRITE: WARN
    READ: WARN

api:
  encryption:
    key: !secret mitsubishi_ac_ischa_api_key

wifi:
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret mitsubishi_ac_ischa_ap_password

climate:
  - id: !extend hp
    debounce_delay: 100ms
    fahrenheit_compatibility: "disabled"
    visual:
      min_temperature: 10
      max_temperature: 31
    supports:
      swing_mode:
        - 'OFF'
        - VERTICAL
    runtime_hours_sensor:
      name: "${friendly_name} Runtime Hours"
      entity_category: diagnostic

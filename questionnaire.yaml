# The questionnaire. Fill this in; multisplit.yaml is generated from it.
#
#   python3 tools/build_config.py            # regenerate multisplit.yaml
#   python3 tools/build_config.py --ask      # walk through what is unanswered
#   python3 tools/build_config.py --check    # fail if the YAML has drifted
#
# Why a questionnaire rather than editing the config directly: the config
# needs curves, seconds and entity ids; a person has answers like "it
# overshot by about a degree and a half, so I powered it off". This file holds
# the questions in the words they were asked, the answers as given, and
# `why` -- what the number does, so the next person to tune it knows what
# they are changing.
#
# `answer: null` means unanswered. An unanswered question with an `assume`
# falls back to that value and is marked UNMEASURED in the generated file; an
# unanswered question without one is an error.

version: 1

sections:
  - title: Outdoor temperature
    questions:
      - id: outdoor_sensor
        ask: Which entity reports the outdoor temperature?
        why: >-
          Every lockout and every participation curve is indexed against this
          entity, so the curves are only valid while it stays the same one. A
          weather service is usually better than the outdoor unit's own
          sensor, which sits in a sun-trap often enough to read several
          degrees off.
        type: entity
        domain: sensor
        target: outdoor_sensor
        answer: sensor.openweathermap_temperature

  - title: Solar surplus
    questions:
      - id: surplus_sensor
        ask: Which binary sensor is on while the house is exporting to the grid?
        why: >-
          Exporting means generating more than the house uses, which is when
          heat is cheapest to make: once net metering ends, exported power is
          worth far less than imported power. While it is on, rooms work
          towards the far end of their comfort band and the building stores
          the heat for later. Leave empty (null) for no sensor, which never
          banks. Only on/off is read; unavailable counts as off.
        type: entity
        domain: binary_sensor
        optional: true
        target: energy.surplus_sensor
        answer: binary_sensor.exporting_to_grid

      - id: surplus_settle_minutes
        ask: How long must the surplus sensor hold a state before the plan follows it?
        why: >-
          A passing cloud would otherwise move every room's target and back
          within minutes. It applies both ways, which also damps the loop the
          banking itself creates: heating on surplus uses the surplus, export
          can stop, and without a settle the plan would stop banking the moment
          it started. Zero follows the sensor immediately.
        type: number
        unit: minutes
        target: energy.settle_minutes
        answer: null
        assume: 10

  - title: Operation
    questions:
      - id: apply_to_hardware
        ask: Should the integration command the units, or only publish what it would do?
        why: >-
          false is shadow mode: the plan is computed every tick and published
          to the status sensors, but nothing is written to any unit. The
          existing blueprints keep running the house, and every divergence
          between what they did and what the planner would have done is either
          a bug here or a behaviour of the old system nobody wrote down. Leave
          this false until those divergences have been looked at; it is the
          cheapest safety net in the project and the only one that costs
          nothing to keep.
        type: boolean
        target: operation.apply_to_hardware
        answer: false

      - id: tick_seconds
        ask: How often should the system re-evaluate everything?
        why: >-
          The reconciler is idempotent and rate-limited per unit, so a fast
          tick costs little and makes the system quicker to correct a unit
          that was changed at the wall. The per-unit rate limit, not this, is
          what protects the compressor.
        type: number
        unit: seconds
        target: operation.tick_seconds
        answer: null
        assume: 30

      - id: write_interval_seconds
        ask: At minimum, how long between two commands to the same unit?
        why: >-
          The per-unit rate limit. It keeps the reconciler clear of the
          compressor's own anti-cycle lockout even if something upstream
          changes its mind rapidly.
        type: number
        unit: seconds
        target: operation.write_interval_seconds
        answer: null
        assume: 180

      - id: stale_after_minutes
        ask: After how long without an update is a temperature reading not to be trusted?
        why: >-
          A room with no trustworthy reading stands by and says so, rather
          than guessing — a stale sensor otherwise produces a confident wrong
          decision for the whole group. Battery sensors that report on change
          need a generous value; a mains-powered one that reports every minute
          does not.
        type: number
        unit: minutes
        target: operation.stale_after_minutes
        answer: null
        assume: 30

  - title: Telemetry
    note: >-
      The participation curves in HARVEST §C2 are the only numbers here that
      must be measured rather than reasoned about, and inertia is the same.
      Telemetry is what makes refitting them possible: one record per cycle
      with target, measured, outdoor and the decision, which
      tools/fit_curves.py turns back into a curve. Without it the numbers can
      only ever be guessed at again.
    questions:
      - id: telemetry_enabled
        ask: Should every cycle be recorded for later analysis?
        why: >-
          Writes one JSON object per cycle: outdoor temperature, and for each
          room its target, measured temperature, what it wanted, what it was
          told to do and why. This is the raw material for fitting the
          overshoot curve and for replaying history against candidate inertia
          values offline — which is possible precisely because the planner is
          a pure function.
        type: boolean
        target: telemetry.enabled
        answer: true

      - id: telemetry_file
        ask: What should the telemetry file be called?
        why: >-
          Relative to the Home Assistant configuration directory. One JSON
          object per line, so it can be read incrementally and tailed.
        type: text
        target: telemetry.file
        answer: multisplit-telemetry.jsonl

      - id: telemetry_on_change
        ask: Should every tick be recorded, or only the ticks that change something?
        why: >-
          Recording every tick is mostly redundant and it is what makes the
          file useless: at a 30 second tick and five rooms it is about 1.8 kB
          a record, 4.9 MB a day, so a 25 MB file holds five days. The curves
          need a season. Recording only when something changes -- a mode, a
          target, what a room wants, or a room's temperature moving more than
          the threshold below -- plus a periodic heartbeat, keeps every
          transition and every point of a room's coast while dropping the
          identical ticks in between. That is roughly a tenth of the volume
          for the same information.
        type: boolean
        target: telemetry.on_change
        answer: true

      - id: telemetry_movement
        ask: How far must a room's temperature move before that alone is recorded?
        why: >-
          What gives the coast its resolution. A room drifting after being
          switched off is the measurement tools/fit_curves.py needs most, and
          it is the one thing a change-triggered record would otherwise miss.
          Smaller means finer curves and a larger file.
        type: number
        unit: degrees
        target: telemetry.movement
        answer: null
        assume: 0.2

      - id: telemetry_heartbeat_minutes
        ask: How often should a record be written even when nothing has changed?
        why: >-
          So a quiet file means a quiet system rather than a broken recorder,
          and so there is a baseline to compare against. Ignored when every
          tick is being recorded.
        type: number
        unit: minutes
        target: telemetry.heartbeat_minutes
        answer: null
        assume: 15

      - id: telemetry_max_mb
        ask: How large may the telemetry file grow before it is rotated?
        why: >-
          On rotation the current file is kept as .1 and a new one started, so
          twice this is the history actually retained. With change-triggered
          recording this works out at roughly half a megabyte a day, so 100 MB
          is comfortably a heating season either side of a rotation -- which is
          the span the participation curves need.
        type: number
        unit: megabytes
        target: telemetry.max_mb
        answer: null
        assume: 100

      - id: telemetry_events
        ask: Should each cycle also be fired as a Home Assistant event?
        why: >-
          Fires multisplit_cycle, which automations and the logbook can react
          to. Independent of the file: the file is for analysis, the event is
          for reacting.
        type: boolean
        target: telemetry.events
        answer: null
        assume: true

  - title: Outdoor units and rooms
    questions:
      - id: groups
        ask: What are the outdoor units, and what should each be called?
        why: >-
          One group per outdoor unit. Rooms on the same outdoor unit cannot
          heat and cool at the same time -- that constraint is the whole
          reason this system exists.
        type: records
        target: groups
        key_field: key
        answer:
          # MXZ-2F53VF5: heating 1.0–7.0 kW, cooling 1.1–5.6 kW. A low minimum,
          # so a single room on this unit can run gently.
          - key: a
            name: Group A
          # MXZ-3F54VF5: heating 2.6–9.0 kW, cooling 2.9–6.8 kW. The minimum is
          # 2.6× Group A's, so one room calling alone gets far more than it needs
          # and overshoots. Expect these rooms to need their own cut-off and rest
          # values once tools/fit_curves.py has field data -- the 1.5° default
          # was one house-wide setting, never measured per group.
          # Both units: cooling rated -10 to +46 °C outdoor, heating -15 to +24 °C
          # (figures from the VF4 data sheets; confirm against the VF5 manual).
          - key: b
            name: Group B

      - id: rooms
        ask: Which rooms are on which outdoor unit, and what does each talk to?
        why: >-
          `temperature_sensors` is in preference order; the first reading that
          is not stale wins. An empty list falls back to the indoor unit's own
          sensor, which sits in the return air path and reads warm while
          heating -- it measures the unit, not the room, so every threshold
          inherits that bias.
        type: records
        target: rooms
        key_field: key
        answer:
          - key: living_room
            name: Living Room
            group: a
            climate_entity: climate.mitsubishi_ac_livingroom_mitsubishi_ac_livingroom_climate
            temperature_sensors: [sensor.average_living_room_temperature]
          - key: ischa
            name: Ischa's Bedroom
            group: a
            # Ends in "climat", not "climate" -- confirm in Developer Tools → States.
            climate_entity: climate.mitsubishi_ac_ischa_mitsubishi_ac_ischa_climate
            temperature_sensors: []
          - key: bedroom
            name: Bedroom
            group: b
            climate_entity: climate.mitsubishi_ac_bedroom_mitsubishi_ac_bedroom_climate
            temperature_sensors: []
          - key: erin
            name: Erin's Bedroom
            group: b
            climate_entity: climate.mitsubishi_ac_erin_mitsubishi_ac_erin_climate
            temperature_sensors: []
          - key: office
            name: Office
            group: b
            climate_entity: climate.mitsubishi_ac_office_mitsubishi_ac_office_climate
            temperature_sensors: []

  - title: The duty cycle
    note: >-
      Measured in the building (HARVEST.md §C). These are the numbers the
      design could not have derived: an indoor unit cannot modulate below its
      minimum capacity, and the compressor speed is set by whichever room is
      working hardest, so a nearly-satisfied room overshoots by design.
    questions:
      - id: cut_off_offset
        ask: How far past target did you let a room go before powering the unit off?
        why: >-
          The overshoot the duty cycle deliberately tolerates. Confirmed as a
          constant: in this building it did not vary with outdoor temperature,
          which is the opposite of what the design first assumed. Entered as a
          curve of [outdoor °C, degrees past target] anyway, so it can vary
          later if tools/fit_curves.py ever says it should; one point is a
          flat line.
        type: curve
        unit: degrees past target
        target: defaults.participation.cut_off_offset
        answer:
          - [0.0, 1.5]

      - id: rest_minutes
        ask: How long did you leave the unit off, and did that depend on the weather?
        why: >-
          This is the part that varied. An overshot room coasts for longer in
          mild weather, so resting it longer both avoids re-heating a room
          that is still drifting down and keeps clear of the compressor's own
          anti-cycle lockout.
        type: curve
        unit: minutes of rest
        target: defaults.participation.rest_minutes
        answer:
          - [0.0, 5]
          - [7.0, 15]
          - [13.0, 25]

      - id: resume_deadband
        ask: How far below target before the unit was allowed to restart?
        why: >-
          Wider than the demand deadband, so a room does not restart the
          moment it drifts a fraction below target.
        type: number
        unit: degrees below target
        target: defaults.participation.resume_deadband
        answer: 0.5

      - id: min_on_minutes
        ask: Once running, how long must a unit stay on before it may be stopped?
        why: >-
          Anti short-cycle protection, and the reason a room already running
          keeps its group in its mode: it cannot stop yet, so the group must
          not change mode out from under it.
        type: number
        unit: minutes
        target: defaults.participation.min_on_minutes
        answer: null
        assume: 5

  - title: What the system is permitted to do
    questions:
      - id: cool_below
        ask: Below what outdoor temperature should cooling be refused?
        why: >-
          A cooling request below this is rejected immediately with a reason,
          rather than waiting indefinitely for an outdoor unit that will not
          deliver it. null disables the lockout.
        type: number_or_null
        unit: °C outdoor
        target: defaults.policy.cool_below
        answer: 20.0

      - id: heat_above
        ask: Above what outdoor temperature should heating be refused?
        why: >-
          The mirror of the cooling lockout. null disables it. With cooling
          refused below 20 and heating refused above 24, the band between them
          allows both and the arbitration decides; outside it the weather
          decides. The loader rejects the pair if they ever cross over and
          leave an outdoor band where neither mode is permitted.
        type: number_or_null
        unit: °C outdoor
        target: defaults.policy.heat_above
        answer: 24.0

      - id: lockout_hysteresis
        ask: How far past a lockout must the weather go before it lifts?
        why: >-
          Without this, an outdoor temperature sitting on the threshold allows
          and forbids cooling on alternate cycles and the group changes its
          mind as fast as the sensor noise.
        type: number
        unit: degrees
        target: defaults.policy.lockout_hysteresis
        answer: null
        assume: 1.0

      - id: season
        ask: Should the system be locked to one season, or decide for itself?
        why: >-
          A seasonal lock is a cheap way to stop a sunny February afternoon
          from asking for cooling. `auto` lets the lockouts decide instead.
        type: choice
        options: [heat, cool, auto]
        target: defaults.policy.season
        answer: auto

      - id: setpoint_range
        ask: What is the lowest and highest target temperature anyone may set?
        why: >-
          Clamps every target, however it arrives -- including the away
          setback below, which is why the loader refuses a range that would
          clamp it. First given as 18-26, which could not hold alongside a
          16 degree away target: the setback would have been clamped up to 18
          and silently never taken effect. Settled at 16-26 so the setback
          does what it says.
        type: pair
        unit: °C
        target: defaults.policy.setpoint_range
        answer: [16.0, 26.0]

      - id: deadband
        ask: How far from target before a room counts as wanting something?
        why: >-
          Smaller than the resume band, because this decides whether a room
          has an opinion at all, not whether its unit should start.
        type: number
        unit: degrees
        target: defaults.policy.deadband
        answer: null
        assume: 0.3

      - id: overshoot_tolerance
        ask: How far past target may a room sit before it counts as wanting the opposite mode?
        why: >-
          Must exceed the cut-off above. A room parked at +1.5 by the duty
          cycle must not be read as asking for cooling, or the two controllers
          are permanently opposed and the compressor pays for it. Checked at
          load time against every room's cut-off.
        type: number
        unit: degrees
        target: defaults.policy.overshoot_tolerance
        answer: 1.5

  - title: Comfort targets
    note: >-
      What a room should be when nothing more specific says otherwise. Once
      schedules are wired in these become the fallback rather than the rule.
    questions:
      - id: default_target
        ask: What should a room aim for when no schedule applies?
        why: >-
          The target a room gets in the absence of a schedule entity, an
          override or an away state. Every room shares it until per-room
          schedules exist.
        type: number
        unit: °C
        target: defaults.intent.default_target
        answer: 20.0

      - id: comfort_band
        ask: How far above the heating target may a room sit before it would rather be cooled?
        why: >-
          Zero is a single setpoint and behaves as it always has. Any wider and
          the pair becomes a comfort band -- heat below 20, cool above 23, do
          not fuss in between -- which is usually closer to what someone
          actually wants, because it says where they are indifferent.

          This is the honest version of setting a unit to its own dual
          setpoint. A unit set to a band decides heat or cool for itself, from
          its own room, with no sight of the others sharing the compressor --
          a decision it has no business taking on a multi-split, since
          choosing costs every other room its mode. Expressed here, the same
          intent is arbitrated by the one component that can see the whole
          group, against the lockouts and the duty cycle, with a reason.

          Heating aims at the bottom of the band and cooling at the top, so
          neither drives the room further into it than asked. A room may
          override this with its own `band`.
        type: number
        unit: degrees
        target: defaults.intent.band
        answer: 2.0
        assume: 0.0

      - id: away_target
        ask: What should a room aim for when the house is unoccupied?
        why: >-
          The setback. It must sit inside the setpoint range above, or it is
          clamped and never takes effect -- the loader checks this, because a
          clamped setback looks exactly like a broken schedule.
        type: number
        unit: °C
        target: defaults.intent.away_target
        answer: 16.0

  - title: Changeover resistance
    note: >-
      Replaces the hysteresis blueprint, the minimum mode runtime and the vote
      thresholds with one decaying bonus. HARVEST.md §D holds the old values,
      which are the evidence for what to put here.
    questions:
      - id: inertia_weight
        ask: How strongly should the group resist changing mode?
        why: >-
          A score bonus for staying put. Too low and it churns; too high and
          it is slow to respond to a genuine need. Unlike a hard minimum
          runtime it only biases the decision -- the system is never forbidden
          from responding.
        type: number
        target: defaults.policy.inertia_weight
        answer: null
        assume: 2.0

      - id: inertia_half_life_minutes
        ask: How quickly should that resistance fade?
        why: The bonus halves every interval, so sustained demand eventually wins.
        type: number
        unit: minutes
        target: defaults.policy.inertia_half_life_minutes
        answer: null
        assume: 20

      - id: aging_rate
        ask: How fast should an unserved room gain priority?
        why: >-
          Extra weight per hour a room's demand goes unmet. This is what makes
          starvation impossible by construction and replaces the request and
          approve protocol: a genuinely starved room wins eventually, with
          nobody pressing a button.
        type: number
        unit: weight per hour
        target: defaults.policy.aging_rate
        answer: null
        assume: 0.5

      - id: stale_grace_minutes
        ask: How long may a running room keep its last decision once its reading goes stale?
        why: >-
          A room that is idle never starts on a stale reading. One already
          running keeps its mode for this long, still honouring its cut-off
          against the last value seen, and then fails safe and stops. Without
          it, a sensor going quiet mid-cycle withdraws heat from a room that
          may still be below target. Zero restores the old rule: stale means
          stop.
        type: number
        unit: minutes
        target: defaults.policy.stale_grace_minutes
        answer: null
        assume: 20

      - id: solar_boost
        ask: On surplus, how far into its comfort band should a room aim?
        why: >-
          Heating aims this much above the bottom of the band (cooling this
          much below the top), never past the other end. It only applies while
          one mode is permitted -- with both open, narrowing the band invites
          heat against cool -- and it does nothing with a band of zero, since
          there is nothing to bank into. Zero turns banking off. A group may
          override it in its own policy, which matters for an outdoor unit
          whose minimum output a small surplus cannot cover.
        type: number
        unit: degrees
        target: defaults.policy.solar_boost
        answer: null
        assume: 1.0

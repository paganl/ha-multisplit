# Multi-split climate control — generated configuration.
#
# DO NOT EDIT. Generated from questionnaire.yaml.
#
# Change an answer in questionnaire.yaml and regenerate:
#
#     python3 tools/build_config.py
#
# or reconfigure through Home Assistant: Settings → Devices & services →
# Multi-split climate → Configure, which writes the answers back and
# regenerates this file.
#
# No threshold, curve, entity id or room name lives in the Python. Lines
# marked UNMEASURED are assumptions standing in for a question nobody has
# answered yet — they are the ones worth revisiting first.

#
# === Outdoor temperature ===
#
# Which entity reports the outdoor temperature?
# Every lockout and every participation curve is indexed against this
# entity, so the curves are only valid while it stays the same one. A
# weather service is usually better than the outdoor unit's own sensor,
# which sits in a sun-trap often enough to read several degrees off.
outdoor_sensor: sensor.openweathermap_temperature
energy:
  #
  # === Solar surplus ===
  #
  # Which binary sensor is on while the house is exporting to the grid?
  # Exporting means generating more than the house uses, which is when heat
  # is cheapest to make: once net metering ends, exported power is worth far
  # less than imported power. While it is on, rooms work towards the far end
  # of their comfort band and the building stores the heat for later. Leave
  # empty (null) for no sensor, which never banks. Only on/off is read;
  # unavailable counts as off.
  surplus_sensor: binary_sensor.exporting_to_grid
  # How long must the surplus sensor hold a state before the plan follows it?
  # A passing cloud would otherwise move every room's target and back within
  # minutes. It applies both ways, which also damps the loop the banking
  # itself creates: heating on surplus uses the surplus, export can stop,
  # and without a settle the plan would stop banking the moment it started.
  # Zero follows the sensor immediately.
  # Units: minutes.
  # UNMEASURED — assumed; the question was left blank.
  settle_minutes: 10.0
operation:
  #
  # === Operation ===
  #
  # Should the integration command the units, or only publish what it would do?
  # false is shadow mode: the plan is computed every tick and published to
  # the status sensors, but nothing is written to any unit. The existing
  # blueprints keep running the house, and every divergence between what
  # they did and what the planner would have done is either a bug here or a
  # behaviour of the old system nobody wrote down. Leave this false until
  # those divergences have been looked at; it is the cheapest safety net in
  # the project and the only one that costs nothing to keep.
  apply_to_hardware: false
  # How often should the system re-evaluate everything?
  # The reconciler is idempotent and rate-limited per unit, so a fast tick
  # costs little and makes the system quicker to correct a unit that was
  # changed at the wall. The per-unit rate limit, not this, is what protects
  # the compressor.
  # Units: seconds.
  # UNMEASURED — assumed; the question was left blank.
  tick_seconds: 30.0
  # At minimum, how long between two commands to the same unit?
  # The per-unit rate limit. It keeps the reconciler clear of the
  # compressor's own anti-cycle lockout even if something upstream changes
  # its mind rapidly.
  # Units: seconds.
  # UNMEASURED — assumed; the question was left blank.
  write_interval_seconds: 180.0
  # After how long without an update is a temperature reading not to be trusted?
  # A room with no trustworthy reading stands by and says so, rather than
  # guessing — a stale sensor otherwise produces a confident wrong decision
  # for the whole group. Battery sensors that report on change need a
  # generous value; a mains-powered one that reports every minute does not.
  # Units: minutes.
  # UNMEASURED — assumed; the question was left blank.
  stale_after_minutes: 30.0
telemetry:
  #
  # === Telemetry ===
  #
  # The participation curves in HARVEST §C2 are the only numbers here that
  # must be measured rather than reasoned about, and inertia is the same.
  # Telemetry is what makes refitting them possible: one record per cycle
  # with target, measured, outdoor and the decision, which
  # tools/fit_curves.py turns back into a curve. Without it the numbers can
  # only ever be guessed at again.
  #
  # Should every cycle be recorded for later analysis?
  # Writes one JSON object per cycle: outdoor temperature, and for each room
  # its target, measured temperature, what it wanted, what it was told to do
  # and why. This is the raw material for fitting the overshoot curve and
  # for replaying history against candidate inertia values offline — which
  # is possible precisely because the planner is a pure function.
  enabled: true
  # What should the telemetry file be called?
  # Relative to the Home Assistant configuration directory. One JSON object
  # per line, so it can be read incrementally and tailed.
  file: multisplit-telemetry.jsonl
  # Should every tick be recorded, or only the ticks that change something?
  # Recording every tick is mostly redundant and it is what makes the file
  # useless: at a 30 second tick and five rooms it is about 1.8 kB a record,
  # 4.9 MB a day, so a 25 MB file holds five days. The curves need a season.
  # Recording only when something changes -- a mode, a target, what a room
  # wants, or a room's temperature moving more than the threshold below --
  # plus a periodic heartbeat, keeps every transition and every point of a
  # room's coast while dropping the identical ticks in between. That is
  # roughly a tenth of the volume for the same information.
  on_change: true
  # How far must a room's temperature move before that alone is recorded?
  # What gives the coast its resolution. A room drifting after being
  # switched off is the measurement tools/fit_curves.py needs most, and it
  # is the one thing a change-triggered record would otherwise miss. Smaller
  # means finer curves and a larger file.
  # Units: degrees.
  # UNMEASURED — assumed; the question was left blank.
  movement: 0.2
  # How often should a record be written even when nothing has changed?
  # So a quiet file means a quiet system rather than a broken recorder, and
  # so there is a baseline to compare against. Ignored when every tick is
  # being recorded.
  # Units: minutes.
  # UNMEASURED — assumed; the question was left blank.
  heartbeat_minutes: 15.0
  # How large may the telemetry file grow before it is rotated?
  # On rotation the current file is kept as .1 and a new one started, so
  # twice this is the history actually retained. With change-triggered
  # recording this works out at roughly half a megabyte a day, so 100 MB is
  # comfortably a heating season either side of a rotation -- which is the
  # span the participation curves need.
  # Units: megabytes.
  # UNMEASURED — assumed; the question was left blank.
  max_mb: 100.0
  # Should each cycle also be fired as a Home Assistant event?
  # Fires multisplit_cycle, which automations and the logbook can react to.
  # Independent of the file: the file is for analysis, the event is for
  # reacting.
  # UNMEASURED — assumed; the question was left blank.
  events: true
#
# === Outdoor units and rooms ===
#
# What are the outdoor units, and what should each be called?
# One group per outdoor unit. Rooms on the same outdoor unit cannot heat
# and cool at the same time -- that constraint is the whole reason this
# system exists.
groups:
  a:
    name: Group A
  b:
    name: Group B
# Which rooms are on which outdoor unit, and what does each talk to?
# `temperature_sensors` is in preference order; the first reading that is
# not stale wins. An empty list falls back to the indoor unit's own
# sensor, which sits in the return air path and reads warm while heating
# -- it measures the unit, not the room, so every threshold inherits that
# bias. Optional per room: `owner`, the Home Assistant user (name or id)
# who may edit the room's schedule besides admins -- without one, only
# admins can; and `min_target` / `max_target`, the range every target for
# the room must sit in, schedule and thermostat alike -- without them, the
# group's setpoint range.
rooms:
  living_room:
    name: Living Room
    group: a
    climate_entity: climate.mitsubishi_ac_livingroom_mitsubishi_ac_livingroom_climate
    temperature_sensors: [sensor.average_living_room_temperature]
  ischa:
    name: Ischa's Bedroom
    group: a
    climate_entity: climate.mitsubishi_ac_ischa_mitsubishi_ac_ischa_climate
    temperature_sensors: []
  bedroom:
    name: Bedroom
    group: b
    climate_entity: climate.mitsubishi_ac_bedroom_mitsubishi_ac_bedroom_climate
    temperature_sensors: []
  erin:
    name: Erin's Bedroom
    group: b
    climate_entity: climate.mitsubishi_ac_erin_mitsubishi_ac_erin_climate
    temperature_sensors: []
  office:
    name: Office
    group: b
    climate_entity: climate.mitsubishi_ac_office_mitsubishi_ac_office_climate
    temperature_sensors: []
defaults:
  participation:
    #
    # === The duty cycle ===
    #
    # Measured in the building (HARVEST.md §C). These are the numbers the
    # design could not have derived: an indoor unit cannot modulate below its
    # minimum capacity, and the compressor speed is set by whichever room is
    # working hardest, so a nearly-satisfied room overshoots by design.
    #
    # How far past target did you let a room go before powering the unit off?
    # The overshoot the duty cycle deliberately tolerates. Confirmed as a
    # constant: in this building it did not vary with outdoor temperature,
    # which is the opposite of what the design first assumed. Entered as a
    # curve of [outdoor °C, degrees past target] anyway, so it can vary later
    # if tools/fit_curves.py ever says it should; one point is a flat line.
    # Units: degrees past target.
    cut_off_offset:
    - [0.0, 1.5]
    # How long did you leave the unit off, and did that depend on the weather?
    # This is the part that varied. An overshot room coasts for longer in mild
    # weather, so resting it longer both avoids re-heating a room that is
    # still drifting down and keeps clear of the compressor's own anti-cycle
    # lockout.
    # Units: minutes of rest.
    rest_minutes:
    - [0.0, 5.0]
    - [7.0, 15.0]
    - [13.0, 25.0]
    # How far below target before the unit was allowed to restart?
    # Wider than the demand deadband, so a room does not restart the moment it
    # drifts a fraction below target.
    # Units: degrees below target.
    resume_deadband: 0.5
    # Once running, how long must a unit stay on before it may be stopped?
    # Anti short-cycle protection, and the reason a room already running keeps
    # its group in its mode: it cannot stop yet, so the group must not change
    # mode out from under it.
    # Units: minutes.
    # UNMEASURED — assumed; the question was left blank.
    min_on_minutes: 5.0
  policy:
    #
    # === What the system is permitted to do ===
    #
    # Below what outdoor temperature should cooling be refused?
    # A cooling request below this is rejected immediately with a reason,
    # rather than waiting indefinitely for an outdoor unit that will not
    # deliver it. null disables the lockout.
    # Units: °C outdoor.
    cool_below: 20.0
    # Above what outdoor temperature should heating be refused?
    # The mirror of the cooling lockout. null disables it. With cooling
    # refused below 20 and heating refused above 24, the band between them
    # allows both and the arbitration decides; outside it the weather decides.
    # The loader rejects the pair if they ever cross over and leave an outdoor
    # band where neither mode is permitted.
    # Units: °C outdoor.
    heat_above: 24.0
    # How far past a lockout must the weather go before it lifts?
    # Without this, an outdoor temperature sitting on the threshold allows and
    # forbids cooling on alternate cycles and the group changes its mind as
    # fast as the sensor noise.
    # Units: degrees.
    # UNMEASURED — assumed; the question was left blank.
    lockout_hysteresis: 1.0
    # Should the system be locked to one season, or decide for itself?
    # A seasonal lock is a cheap way to stop a sunny February afternoon from
    # asking for cooling. `auto` lets the lockouts decide instead.
    season: auto
    # What is the lowest and highest target temperature anyone may set?
    # Clamps every target, however it arrives -- including the away setback
    # below, which is why the loader refuses a range that would clamp it.
    # First given as 18-26, which could not hold alongside a 16 degree away
    # target: the setback would have been clamped up to 18 and silently never
    # taken effect. Settled at 16-26 so the setback does what it says.
    # Units: °C.
    setpoint_range: [16.0, 26.0]
    # How far from target before a room counts as wanting something?
    # Smaller than the resume band, because this decides whether a room has an
    # opinion at all, not whether its unit should start.
    # Units: degrees.
    # UNMEASURED — assumed; the question was left blank.
    deadband: 0.3
    # How far past target may a room sit before it counts as wanting the opposite mode?
    # Must exceed the cut-off above. A room parked at +1.5 by the duty cycle
    # must not be read as asking for cooling, or the two controllers are
    # permanently opposed and the compressor pays for it. Checked at load time
    # against every room's cut-off.
    # Units: degrees.
    overshoot_tolerance: 1.5
    #
    # === Changeover resistance ===
    #
    # Replaces the hysteresis blueprint, the minimum mode runtime and the vote
    # thresholds with one decaying bonus. HARVEST.md §D holds the old values,
    # which are the evidence for what to put here.
    #
    # How strongly should the group resist changing mode?
    # A score bonus for staying put. Too low and it churns; too high and it is
    # slow to respond to a genuine need. Unlike a hard minimum runtime it only
    # biases the decision -- the system is never forbidden from responding.
    # UNMEASURED — assumed; the question was left blank.
    inertia_weight: 2.0
    # How quickly should that resistance fade?
    # The bonus halves every interval, so sustained demand eventually wins.
    # Units: minutes.
    # UNMEASURED — assumed; the question was left blank.
    inertia_half_life_minutes: 20.0
    # How fast should an unserved room gain priority?
    # Extra weight per hour a room's demand goes unmet. This is what makes
    # starvation impossible by construction and replaces the request and
    # approve protocol: a genuinely starved room wins eventually, with nobody
    # pressing a button.
    # Units: weight per hour.
    # UNMEASURED — assumed; the question was left blank.
    aging_rate: 0.5
    # How long may a running room keep its last decision once its reading goes stale?
    # A room that is idle never starts on a stale reading. One already running
    # keeps its mode for this long, still honouring its cut-off against the
    # last value seen, and then fails safe and stops. Without it, a sensor
    # going quiet mid-cycle withdraws heat from a room that may still be below
    # target. Zero restores the old rule: stale means stop.
    # Units: minutes.
    # UNMEASURED — assumed; the question was left blank.
    stale_grace_minutes: 20.0
    # On surplus, how far into its comfort band should a room aim?
    # Heating aims this much above the bottom of the band (cooling this much
    # below the top), never past the other end. It only applies while one mode
    # is permitted -- with both open, narrowing the band invites heat against
    # cool -- and it does nothing with a band of zero, since there is nothing
    # to bank into. Zero turns banking off. A group may override it in its own
    # policy, which matters for an outdoor unit whose minimum output a small
    # surplus cannot cover.
    # Units: degrees.
    # UNMEASURED — assumed; the question was left blank.
    solar_boost: 1.0
  intent:
    #
    # === Comfort targets ===
    #
    # What a room should be when nothing more specific says otherwise. Once
    # schedules are wired in these become the fallback rather than the rule.
    #
    # What should a room aim for when no schedule applies?
    # The target a room gets in the absence of a schedule entity, an override
    # or an away state. Every room shares it until per-room schedules exist.
    # Units: °C.
    default_target: 20.0
    # How far above the heating target may a room sit before it would rather be cooled?
    # Zero is a single setpoint and behaves as it always has. Any wider and
    # the pair becomes a comfort band -- heat below 20, cool above 23, do not
    # fuss in between -- which is usually closer to what someone actually
    # wants, because it says where they are indifferent. This is the honest
    # version of setting a unit to its own dual setpoint. A unit set to a band
    # decides heat or cool for itself, from its own room, with no sight of the
    # others sharing the compressor -- a decision it has no business taking on
    # a multi-split, since choosing costs every other room its mode. Expressed
    # here, the same intent is arbitrated by the one component that can see
    # the whole group, against the lockouts and the duty cycle, with a reason.
    # Heating aims at the bottom of the band and cooling at the top, so
    # neither drives the room further into it than asked. A room may override
    # this with its own `band`.
    # Units: degrees.
    band: 2.0
    # What is the shortest setting a room's schedule may contain?
    # Measured from one mark to the next, wrapping the week. A schedule that
    # changes target every few minutes short-cycles a compressor shared with
    # other rooms, so a mark that would leave a shorter setting is refused
    # with a reason. Zero allows any length.
    # Units: minutes.
    # UNMEASURED — assumed; the question was left blank.
    min_block_minutes: 30.0
    # What should a room aim for when the house is unoccupied?
    # The setback. It must sit inside the setpoint range above, or it is
    # clamped and never takes effect -- the loader checks this, because a
    # clamped setback looks exactly like a broken schedule.
    # Units: °C.
    away_target: 16.0

# Multi-split climate control — generated configuration.
#
# DO NOT EDIT. Generated from questionnaire.yaml by tools/build_config.py.
# Change an answer there and regenerate:
#
#     python3 tools/build_config.py
#
# Copy to the Home Assistant configuration directory as multisplit.yaml.
#
# No threshold, curve, entity id or room name lives in the Python. Lines
# marked UNMEASURED are assumptions standing in for a question nobody has
# answered yet — they are the ones worth revisiting first.

#
# === Outdoor temperature ===
#
# Which entity reports the outdoor temperature?
# Every lockout and every participation curve is indexed against this
# entity, so the curves are only valid while it stays the same one. A
# weather service is usually better than the outdoor unit's own sensor,
# which sits in a sun-trap often enough to read several degrees off.
outdoor_sensor: sensor.openweathermap_temperature
#
# === Outdoor units and rooms ===
#
# What are the outdoor units, and what should each be called?
# One group per outdoor unit. Rooms on the same outdoor unit cannot heat
# and cool at the same time -- that constraint is the whole reason this
# system exists.
groups:
  a:
    name: Group A
  b:
    name: Group B
# Which rooms are on which outdoor unit, and what does each talk to?
# `temperature_sensors` is in preference order; the first reading that is
# not stale wins. An empty list falls back to the indoor unit's own
# sensor, which sits in the return air path and reads warm while heating
# -- it measures the unit, not the room, so every threshold inherits that
# bias.
rooms:
  living_room:
    name: Living Room
    group: a
    climate_entity: climate.mitsubishi_ac_livingroom_mitsubishi_ac_livingroom_climate
    temperature_sensors: [sensor.average_living_room_temperature]
  ischa:
    name: Ischa's Bedroom
    group: a
    climate_entity: climate.mitsubishi_ac_ischa_mitsubishi_ac_ischa_climat
    temperature_sensors: []
  bedroom:
    name: Bedroom
    group: b
    climate_entity: climate.mitsubishi_ac_bedroom_mitsubishi_ac_bedroom_climate
    temperature_sensors: []
  erin:
    name: Erin's Bedroom
    group: b
    climate_entity: climate.mitsubishi_ac_erin_mitsubishi_ac_erin_climate
    temperature_sensors: []
  office:
    name: Office
    group: b
    climate_entity: climate.mitsubishi_ac_office_mitsubishi_ac_office_climate
    temperature_sensors: []
defaults:
  participation:
    #
    # === The duty cycle ===
    #
    # Measured in the building (HARVEST.md §C). These are the numbers the
    # design could not have derived: an indoor unit cannot modulate below its
    # minimum capacity, and the compressor speed is set by whichever room is
    # working hardest, so a nearly-satisfied room overshoots by design.
    #
    # How far past target did you let a room go before powering the unit off?
    # The overshoot the duty cycle deliberately tolerates. Measured as a
    # constant here -- it did not vary with outdoor temperature. Entered as a
    # curve of [outdoor °C, degrees past target] so it can vary later if a
    # measurement ever says it should; one point is a flat line.
    # Units: degrees past target.
    cut_off_offset:
    - [0.0, 1.5]
    # How long did you leave the unit off, and did that depend on the weather?
    # This is the part that varied. An overshot room coasts for longer in mild
    # weather, so resting it longer both avoids re-heating a room that is
    # still drifting down and keeps clear of the compressor's own anti-cycle
    # lockout.
    # Units: minutes of rest.
    rest_minutes:
    - [0.0, 5.0]
    - [7.0, 15.0]
    - [13.0, 25.0]
    # How far below target before the unit was allowed to restart?
    # Wider than the demand deadband, so a room does not restart the moment it
    # drifts a fraction below target.
    # Units: degrees below target.
    resume_deadband: 0.5
    # Once running, how long must a unit stay on before it may be stopped?
    # Anti short-cycle protection, and the reason a room already running keeps
    # its group in its mode: it cannot stop yet, so the group must not change
    # mode out from under it.
    # Units: minutes.
    # UNMEASURED — assumed; the question was left blank.
    min_on_minutes: 5.0
  policy:
    #
    # === What the system is permitted to do ===
    #
    # Below what outdoor temperature should cooling be refused?
    # A cooling request below this is rejected immediately with a reason,
    # rather than waiting indefinitely for an outdoor unit that will not
    # deliver it. null disables the lockout.
    # Units: °C outdoor.
    cool_below: 22.0
    # Above what outdoor temperature should heating be refused?
    # The mirror of the cooling lockout. null disables it.
    # Units: °C outdoor.
    # UNMEASURED — assumed; the question was left blank.
    heat_above: null
    # How far past a lockout must the weather go before it lifts?
    # Without this, an outdoor temperature sitting on the threshold allows and
    # forbids cooling on alternate cycles and the group changes its mind as
    # fast as the sensor noise.
    # Units: degrees.
    # UNMEASURED — assumed; the question was left blank.
    lockout_hysteresis: 1.0
    # Should the system be locked to one season, or decide for itself?
    # A seasonal lock is a cheap way to stop a sunny February afternoon from
    # asking for cooling. `auto` lets the lockouts decide instead.
    season: auto
    # What is the lowest and highest target temperature anyone may set?
    # Clamps every target, however it arrives.
    # Units: °C.
    setpoint_range: [15.0, 26.0]
    # How far from target before a room counts as wanting something?
    # Smaller than the resume band, because this decides whether a room has an
    # opinion at all, not whether its unit should start.
    # Units: degrees.
    # UNMEASURED — assumed; the question was left blank.
    deadband: 0.3
    # How far past target may a room sit before it counts as wanting the opposite mode?
    # Must exceed the cut-off above. A room parked at +1.5 by the duty cycle
    # must not be read as asking for cooling, or the two controllers are
    # permanently opposed and the compressor pays for it. Checked at load time
    # against every room's cut-off.
    # Units: degrees.
    overshoot_tolerance: 1.5
    #
    # === Changeover resistance ===
    #
    # Replaces the hysteresis blueprint, the minimum mode runtime and the vote
    # thresholds with one decaying bonus. HARVEST.md §D holds the old values,
    # which are the evidence for what to put here.
    #
    # How strongly should the group resist changing mode?
    # A score bonus for staying put. Too low and it churns; too high and it is
    # slow to respond to a genuine need. Unlike a hard minimum runtime it only
    # biases the decision -- the system is never forbidden from responding.
    # UNMEASURED — assumed; the question was left blank.
    inertia_weight: 2.0
    # How quickly should that resistance fade?
    # The bonus halves every interval, so sustained demand eventually wins.
    # Units: minutes.
    # UNMEASURED — assumed; the question was left blank.
    inertia_half_life_minutes: 20.0
    # How fast should an unserved room gain priority?
    # Extra weight per hour a room's demand goes unmet. This is what makes
    # starvation impossible by construction and replaces the request and
    # approve protocol: a genuinely starved room wins eventually, with nobody
    # pressing a button.
    # Units: weight per hour.
    # UNMEASURED — assumed; the question was left blank.
    aging_rate: 0.5
